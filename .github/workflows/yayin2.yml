name: Yayin
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
concurrency:
  group: yayin
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Veri uret
        shell: pwsh
        run: ./yayin-uret.ps1 -MaxAnaliz 6 -MaxStats 2

      # Kutuphane (istatistik/analiz onbellegi) main'e yazilir. Ayni dosyalar
      # onceki calismalarda da uretildigi icin rebase sirasinda cakisma olabilir:
      # uretilen JSON'larda "bizim yeni dosyamiz" kazanir. Bu adim basarisiz olsa
      # bile site yayini durmaz (continue-on-error).
      - name: Kutuphane degisikliklerini kaydet
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/istatistik-*.json veri/analiz-*.json veri/gun-*.json)
          if (-not (git diff --cached --quiet)) {
            git commit -m "kutuphane guncellendi"
            git pull --rebase -X theirs
            if ($LASTEXITCODE -ne 0) { git rebase --abort; Write-Host "kutuphane birlestirilemedi, site yayini devam ediyor"; exit 0 }
            git push
            if ($LASTEXITCODE -ne 0) { Write-Host "kutuphane gonderilemedi, site yayini devam ediyor" }
          } else { Write-Host "kutuphane degismedi" }

      - name: GitHub Pages dalina gonder
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "site"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item -Path (Join-Path $PWD "public\*") -Destination $tmp -Recurse -Force
          Set-Location $tmp
          git init -q
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "site"
          $url = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f $url gh-pages
          if ($LASTEXITCODE -ne 0) { Write-Host "GONDERIM BASARISIZ"; exit 1 }
          Write-Host "gh-pages dali gonderildi"
