name: Yayin
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
concurrency:
  group: yayin
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Veri uret
        shell: pwsh
        run: ./yayin-uret.ps1 -MaxAnaliz 6 -MaxStats 2

      - name: Kutuphane degisikliklerini kaydet
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/istatistik-*.json veri/analiz-*.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "kutuphane guncellendi"
            git pull --rebase
            git push
          } else { Write-Host "kutuphane degismedi" }

      - name: Yayin dalina gonder
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "yayin"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item -Path (Join-Path $PWD "public\*") -Destination $tmp -Recurse -Force
          Set-Location $tmp
          git init -q
          git checkout -q -b yayin
          git add -A
          git commit -q -m "yayin"
          $url = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f $url yayin
          Write-Host "yayin dali gonderildi"
