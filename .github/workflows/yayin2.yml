name: Yayin
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
concurrency:
  group: yayin
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Veri uret
        shell: pwsh
        run: ./yayin-uret.ps1 -MaxAnaliz 6 -MaxStats 2

      - name: Kutuphane degisikliklerini kaydet
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/istatistik-*.json veri/analiz-*.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "kutuphane guncellendi"
            git pull --rebase
            git push
          } else { Write-Host "kutuphane degismedi" }

      - name: Worker dalina gonder
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "worker"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $tmp "src") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $tmp "public") -Force | Out-Null
          Copy-Item -Path (Join-Path $PWD "public\*") -Destination (Join-Path $tmp "public") -Recurse -Force
          Copy-Item -Path (Join-Path $PWD "yayin-worker.js") -Destination (Join-Path $tmp "src\_worker.js") -Force
          Copy-Item -Path (Join-Path $PWD "wrangler.toml") -Destination (Join-Path $tmp "wrangler.toml") -Force
          Set-Location $tmp
          git init -q
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b worker
          git add -A
          git commit -q -m "worker yayini"
          $url = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f $url worker
          if ($LASTEXITCODE -ne 0) { Write-Host "GONDERIM BASARISIZ"; exit 1 }
          Write-Host "worker dali gonderildi"
