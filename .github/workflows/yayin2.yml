name: Yayin
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
concurrency:
  group: yayin
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  yayinla:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Kimlikleri duzelt
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $t = (($env:CLOUDFLARE_API_TOKEN) -replace '\s','')
          $a = (($env:CLOUDFLARE_ACCOUNT_ID) -replace '\s','')
          "CLOUDFLARE_API_TOKEN=$t" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CLOUDFLARE_ACCOUNT_ID=$a" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "token uzunluk: $($t.Length) | hesap kimligi uzunluk: $($a.Length)"
          if ($a.Length -ne 32) { Write-Host "UYARI: hesap kimligi 32 karakter degil" }

      - name: Veri uret
        shell: pwsh
        run: ./yayin-uret.ps1 -MaxAnaliz 6 -MaxStats 2

      - name: Cloudflare projesi (yoksa olustur)
        shell: pwsh
        run: |
          npx --yes wrangler@3 pages project create atyarisi --production-branch=main
          Write-Host "cikis kodu: $LASTEXITCODE"
          exit 0

      - name: Cloudflare Pages'e yukle
        shell: pwsh
        run: npx --yes wrangler@3 pages deploy public --project-name=atyarisi --branch=main --commit-dirty=true

      - name: Istatistik kutuphanesini kaydet
        shell: pwsh
        run: |
          git config user.name "atyarisi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/istatistik-*.json veri/analiz-*.json
          if (git diff --cached --quiet) { Write-Host "kutuphane degismedi" } else {
            git commit -m "istatistik kutuphanesi guncellendi"
            git pull --rebase
            git push
          }
