<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naim Baba Yarış Analizi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Naim Baba Yarış Analizi — TJK</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d222b; --ink:#e8ecf1; --muted:#98a2b3;
    --line:#2a3140; --accent:#4f8cff; --good:#2fbf71; --warn:#f0a63c; --bad:#e0575b;
    --kum:#8a5a2b; --cim:#2e7d32; --side:#12151b;
  }
  :root[data-theme="light"]{
    --bg:#f5f7fb; --card:#ffffff; --card2:#f0f3f8; --ink:#1c2430; --muted:#5b6676;
    --line:#dfe5ee; --accent:#2f6fe0; --good:#128a4b; --warn:#b9781d; --bad:#c23b3f; --side:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .hlinks{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap;align-items:center}
  .hlinks a,.hlinks button{padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:inherit;text-decoration:none;background:none;cursor:pointer}
  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
  /* Logo: sol tarafta dikey kutu; baslik + alt bilgi + Koşu türleri satiri saginda kalir */
  [hidden]{display:none!important}
  .ust{display:flex;gap:12px;align-items:flex-start}
  .ustSag{flex:1 1 auto;min-width:0}
  .logoKutu{flex:0 0 auto;width:118px;height:84px;display:flex;align-items:center;justify-content:center;
    border:1.5px dashed var(--line);border-radius:10px;background:var(--card);color:var(--muted);
    cursor:pointer;overflow:hidden;padding:3px;text-align:center;font-size:10px;line-height:1.2;letter-spacing:.04em;user-select:none}
  .logoKutu:hover{border-color:var(--accent);color:var(--ink)}
  .logoKutu img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block;border-radius:7px}
  .logoKutu small{font-size:9px;opacity:.8}
  .wrap{max-width:1400px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px}
  .datenav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .datenav button,.datenav select{padding:7px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;cursor:pointer;font-size:13.5px}
  .datenav .today{color:var(--accent);font-weight:600}
  .loadbanner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:99;background:var(--accent);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none;max-width:94vw}
  .loadbanner button,.errorbar button{margin-left:8px;border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12.5px}
  .errorbar{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:99;background:var(--bad);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:block;max-width:94vw}
  .verdict{border-radius:12px;padding:11px 14px;margin:2px 0 12px;border:1px solid var(--line);background:var(--card2)}
  .verdict b{font-size:14px}
  .verdict.v-yuksek{border-color:var(--bad);background:rgba(224,87,91,.12)}
  .verdict.v-dusuk{border-color:var(--good);background:rgba(47,191,113,.12)}
  .verdict.v-orta{border-color:var(--warn);background:rgba(240,166,60,.12)}
  .verdict.v-yok{opacity:.7}
  .verdict.v-program{border-color:var(--accent);background:rgba(79,140,255,.10)}
  .layout{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px;align-items:start}
  main{min-width:0}
  aside{position:sticky;top:calc(var(--hdr, 150px) + 8px);background:var(--side);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:calc(100dvh - var(--hdr, 150px) - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:auto;scrollbar-color:#9aa7b4 #222a33}
aside::-webkit-scrollbar{width:10px}
aside::-webkit-scrollbar-track{background:#222a33;border-radius:5px}
aside::-webkit-scrollbar-thumb{background:#9aa7b4;border-radius:5px;border:1px solid #222a33}
#jk-title{position:sticky;top:-14px;z-index:2;background:var(--side);padding:6px 0;margin:0}
  .side-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .side-h h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .themetog{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
  #jkDetay summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
  #jkDetay summary::-webkit-details-marker{display:none}
  #jkDetay summary::after{content:'▾';color:var(--muted);font-size:13px}
  #jkDetay[open] summary::after{content:'▴'}
  .section-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px;font-weight:700}
  .cityhead{font-size:16px;margin:18px 2px 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .cities{display:flex;flex-wrap:wrap;gap:7px}
  .citybtn{padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;font-size:13px}
  .citybtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .racechip{display:block;width:100%;text-align:left;padding:6px 10px;margin:4px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:12.5px}
  .racechip:hover{border-color:var(--accent)}
  .side .rank{padding:4px 0}
  .race{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden;scroll-margin-top:80px}
  .at-mini{display:none}
  @media (max-width:700px){
    .at-mini{display:block;margin-top:2px;font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
    .at-mini.acik{white-space:normal}
  }
  details.pmes summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
  details.pmes summary::-webkit-details-marker{display:none}
  details.pmes summary::after{content:'▾';color:var(--muted);font-size:13px;padding-right:2px}
  details.pmes[open] summary::after{content:'▴'}
  details.pmes summary h4{margin:0}
  .jokey-hit{color:#3ecf8e;font-weight:700}
  .jokey-hit .small{color:#3ecf8e;font-weight:600}
  .jokey-row td{background:rgba(62,207,142,.13)}
  .jokey-row td:first-child{box-shadow:inset 3px 0 0 #3ecf8e}
  .jokeybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#12211a;border:1px solid #2f6d4f;color:#cdebd8;border-radius:10px;padding:8px 12px;margin:6px 0 12px;font-size:13px}
  .jokeybar a{color:#8fd6b0}
  .jokeyfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
  .jokeyfilter input{flex:1;min-width:200px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px}
  .jokeyfilter input:focus{outline:none;border-color:#3ecf8e}
  .chip.top4{background:#12211a;border-color:#2f6d4f;color:#cdebd8}
  .sonucbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px;padding:7px 12px;
    border-top:1px solid var(--line);background:rgba(47,191,113,.08);font-size:12.5px;cursor:pointer}
  .sonucbar .sb-ad{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--good)}
  .sonucbar .sb-at{white-space:nowrap}
  .sonucbar .sb-at>b{color:var(--good)}
  #gunSonucPanel{max-width:1400px;margin:12px auto 0;padding:12px 16px;border:1px solid var(--line);
    border-radius:12px;background:var(--card,#171b22)}
  #gunSonucPanel h3{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);margin:12px 0 6px}
  #gunSonucPanel h3:first-of-type{margin-top:2px}
  .ghdr{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
  .grow{padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.6}
  .gat{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px}
  .gat>span{white-space:nowrap}
  .galt{margin:8px 0 2px;padding:7px 10px;border-radius:8px;background:rgba(47,191,113,.12);font-size:13px}
  .rank[data-j]{cursor:pointer;border-radius:6px;padding-left:4px}
  .rank[data-j]:hover{background:rgba(79,140,255,.10)}
  .rank.selj{background:rgba(62,207,142,.14);border-left:2px solid #3ecf8e}
  .race-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 15px;cursor:pointer;user-select:none}
  .race-h:hover{background:var(--card2)}
  .race-no{font-weight:700;font-size:16px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.pist{color:#fff;border:none}
  .chip.pist.kum{background:var(--kum)} .chip.pist.cim{background:var(--cim)}
  .chip.done{background:rgba(47,191,113,.16);color:var(--good);border-color:transparent}
  .chip.link{text-decoration:none;color:var(--accent);border-color:var(--accent)}
  .chip.link:hover{background:var(--accent);color:#fff}
  .spacer{flex:1}
  .toggle{color:var(--muted);font-size:13px}
  .race-b{padding:0 15px 15px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right}
  tr:last-child td{border-bottom:none}
  .name{font-weight:600;white-space:normal}
  .small{color:var(--muted);font-size:12px}
  .mtime{font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
  .mdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);vertical-align:1px;margin:0 1px}
  .mdot.bad{background:var(--warn)}
  .mcity{font-size:10px;font-weight:700;letter-spacing:.4px;vertical-align:1px}
  .mcity.ok{color:var(--good)}
  .mcity.bad{color:var(--warn)}
  .mtrk{font-size:10px;color:var(--muted);white-space:nowrap}
  td.orj{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;font-weight:600}
  .b-kum{background:rgba(138,90,43,.18);color:#c98a4b}
  .b-cim{background:rgba(46,125,50,.18);color:#4caf50}
  .b-dengeli{background:rgba(240,166,60,.16);color:var(--warn)}
  .b-yok{color:var(--muted)}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:14px}
  .panel{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .panel h4{margin:0 0 8px;font-size:13px;letter-spacing:.02em}
  .rank{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .rank:last-child{border-bottom:none}
  .rank b{color:var(--ink)}
  .star{color:var(--warn)}
  .btn-stats{margin-top:14px;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-weight:600}
  .btn-stats:hover{background:var(--accent);color:#fff}
  .stats{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .bars{display:flex;flex-direction:column;gap:6px}
  .bar{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:8px;font-size:12.5px}
  .bar .track{height:9px;background:var(--card);border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent)}
  .kpi{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
  .kpi div{font-size:13px}
  .kpi b{font-size:17px;display:block}
  .ok{color:var(--good)} .no{color:var(--bad)} .mut{color:var(--muted)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 16px}
  .note{font-size:12px;color:var(--muted);margin-top:6px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
  .datenav{display:flex;align-items:center;gap:6px;position:relative}
  .datenav button{padding:7px 11px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;cursor:pointer}
  .datenav .dtlbl{font-weight:600;min-width:150px;text-align:center}
  .datenav .mini{font-size:12px;padding:6px 9px;color:var(--accent)}
  .dthide{position:absolute;left:0;bottom:0;opacity:0;width:0;height:0;border:0;padding:0}
  .cityrow{display:flex;align-items:center;gap:4px;width:100%;max-width:100%;overflow:hidden}
  .cscroll{flex:0 0 auto;width:26px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;padding:0}
  .citybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;max-width:none;flex:1 1 auto;min-width:0;scrollbar-width:auto;scrollbar-color:#9aa7b4 #222a33;-webkit-overflow-scrolling:touch}
  .citybar::-webkit-scrollbar{height:10px;display:block}
  .citybar::-webkit-scrollbar-track{background:#222a33;border-radius:5px}
  .citybar::-webkit-scrollbar-thumb{background:#9aa7b4;border-radius:5px;border:1px solid #222a33}
  .citybar::-webkit-scrollbar-thumb:hover{background:#c3ccd6}
  .citybar .citybtn{white-space:nowrap;flex:0 0 auto}
  .racechips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .racechips .racechip{width:auto;flex:0 0 auto;margin:0;white-space:nowrap;padding:6px 10px}
  .racechips::-webkit-scrollbar{height:8px}
  .racechips::-webkit-scrollbar-track{background:#222a33;border-radius:5px}
  .racechips::-webkit-scrollbar-thumb{background:#9aa7b4;border-radius:5px}
  .citybtn.yd{color:var(--muted)}
  .turstat{margin:10px 0 4px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}
  .turstat .small,.turstat .mut{color:var(--muted)}
  .hazirbox{background:rgba(240,166,60,.12);border:1px solid rgba(240,166,60,.45);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
  .hazirbox b{color:var(--warn)}
  .turstat table{width:100%;border-collapse:collapse;font-size:12px}
  .turstat th,.turstat td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .turstat th{color:var(--muted);font-size:11px;text-transform:uppercase}
  .mchip{display:inline-block;font-size:12px;color:var(--muted);margin-right:8px}
  @media(max-width:980px){
    .layout{grid-template-columns:1fr}
    aside{position:static;max-height:none;order:-1;margin:2px 0 8px}
    .hide-s{display:none}
  }
  @media(max-width:640px){
    .datenav button,.datenav .dtlbl,.themetog,.citybtn,.racechip{min-height:40px}
    .cscroll{width:40px;height:40px}
    th,td{padding:6px 5px}
    .datenav .dtlbl{min-width:118px;font-size:12.5px}
    .datenav button{padding:6px 9px}
    .ust{gap:8px}
    .logoKutu{width:86px;height:58px;font-size:9px}
    .ustSag h1{font-size:17px}
    .ustSag .sub{font-size:12px}
    .ustSag .hrow{gap:6px}
    .ustSag .themetog{font-size:11.5px;padding:5px 8px}
    .hlinks{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;margin:2px 0 6px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .hlinks::-webkit-scrollbar{display:none}
    .hlinks a,.hlinks button{flex:0 0 auto;font-size:11.5px;padding:5px 9px;min-height:32px;white-space:nowrap}
  }
</style>
</head>

<header><div class="wrap">
  <div class="ust">
    <div class="logoKutu" id="logoKutu" title="Logo eklemek/değiştirmek için tıkla (sağ tık: kaldır)">
      <img id="logoImg" src="logo-kucuk.webp" alt="Naim Baba">
      <span id="logoYazi">LOGO<br><small>tıkla · ekle</small></span>
      <input type="file" id="logoDosya" accept="image/*" hidden>
    </div>
    <div class="ustSag">
      <div class="hrow">
        <h1>Naim Baba Yarış Analizi</h1>
        <div style="display:flex;gap:8px">
          <button class="themetog" id="yenile" onclick="guncelle()">⟳ Güncelle</button>
          <button class="themetog" id="themetog" onclick="toggleTheme()">Tema</button>
        </div>
      </div>
      <div class="sub" id="sub"></div>
      <div class="hlinks">
        <a href="turler.html">Koşu türleri</a>
        <a href="jokeyler.html">Jokey başarısı</a>
        <a href="jokey-matris.html">Jokey × Hipodrom</a>
        <button id="gunSonucBtn" type="button" onclick="gunSonucCiz()">Günün sonuçları</button>
      </div>
    </div>
  </div>
  <div class="topbar">
    <div class="datenav" id="datenav"></div>
    <div class="cityrow">

<script>
let DATA = JSON.parse(document.getElementById('data').textContent);
let DAYS = [];
let DONEM = DATA.Donem || new Date().getFullYear();
let dayIdx = 0;
let cityIdx = -1;

function initFromData(){
  DONEM = DATA.Donem || new Date().getFullYear();
  DAYS = (DATA.Tarihler && DATA.Tarihler.length) ? DATA.Tarihler : [{Tarih:DATA.Tarih, Hava:DATA.Hava, Sehirler:DATA.Sehirler}];
  dayIdx = Math.max(0, DAYS.findIndex(d => d.Tarih === DATA.Tarih));
  if (dayIdx < 0) dayIdx = 0;
  cityIdx = -1;
}

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VLABEL = {KUM:'Kumcu', CIM:'Çimci', DENGELI:'Dengeli', YOK:'—'};
const VCLS = {KUM:'b-kum', CIM:'b-cim', DENGELI:'b-dengeli', YOK:'b-yok'};

function temaUygula(t, kaydet){
  t = (t === 'light') ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try {
    var mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute('content', t === 'light' ? '#f5f7fb' : '#0f1115');
    if (kaydet) localStorage.setItem('at-tema', t);
  } catch(e){}
  var btn = document.getElementById('themetog');
  if (btn) btn.textContent = t === 'dark' ? 'Açık tema' : 'Koyu tema';
}
function toggleTheme(){
  temaUygula(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
}
(function(){
  var t = '';
  try { t = localStorage.getItem('at-tema') || ''; } catch(e){}
  if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
  temaUygula(t || 'dark', false);
  try {
    if (window.innerWidth <= 980) {
      var jd = document.getElementById('jkDetay');
      if (jd) jd.removeAttribute('open');
    }
  } catch(e){}
})();

function isPast(tarih){
  const p = tarih.split('/'); if (p.length !== 3) return false;
  const d = new Date(+p[2], +p[1]-1, +p[0]);
  const t = new Date(); t.setHours(0,0,0,0);
  return d < t;
}

function currentDay(){ return DAYS[dayIdx]; }
function currentCity(){ return (cityIdx >= 0) ? (currentDay().Sehirler||[])[cityIdx] : null; }

function renderSub(){
  const d = currentDay() || { Tarih: DATA.Tarih || '', Hava: DATA.Hava };
  const c = currentCity();
  const label = c ? kisaYer(c.Ad) : 'Tüm koşular (yurt içi + yurt dışı)';
  document.getElementById('sub').textContent =
    `Tarih: ${d.Tarih}${gunAdi(d.Tarih)} · ${label}` + (d.Hava ? ` · ${d.Hava}` : '') + ` · Dönem: ${DONEM} · Üretim: ${DATA.Uretim}`
    + (DATA.Uyari ? ` · ⚠ ${DATA.Uyari}` : '')
    + (DATA.__api__ === false
        ? ' · site saatlik güncellenir'
        : ((DATA.Bilgi && !DATA.Uyari) ? ` · ⓘ ${DATA.Bilgi}` : ''))
    + ' · sürüm 24.11-4';
}

function gunAdi(tr){ const p=String(tr||'').split(/[./]/); if(p.length<3) return ''; const dt=new Date(Number(p[2]),Number(p[1])-1,Number(p[0])); if(isNaN(dt)) return ''; const g=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi']; return ' ('+g[dt.getDay()]+')'; }
function isoOf(d){ const x=new Date(d.getTime()-d.getTimezoneOffset()*60000); return x.toISOString().slice(0,10); }
function isoFromTR(s){ const p=(s||'').split('/'); if(p.length===3) return `${p[2]}-${p[1]}-${p[0]}`; return isoOf(new Date()); }
let currentAbort = null;
let loadSeq = 0;
let lastGoodIso = null;
function isoToTR(iso){ const p=(iso||'').split('-'); return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso; }
function prevIso(iso){
  const p=(iso||'').split('-'); if(p.length!==3) return isoOf(new Date());
  const d=new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()-1); return isoOf(d);
}
function ensureBanner(){
  let b=document.getElementById('loadbanner');
  if(!b){ b=document.createElement('div'); b.id='loadbanner'; b.className='loadbanner'; document.body.appendChild(b); }
  b.className='loadbanner'; b.style.display='block'; return b;
}
let bannerTimer = null;
function hideBanner(){
  const b=document.getElementById('loadbanner'); if(b) b.style.display='none';
  if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer=null; }
}
function showError(msg, iso, sessiz){
  const b=ensureBanner();
  b.className = sessiz ? 'loadbanner' : 'errorbar';
  let extra='';
  if (lastGoodIso) { extra=' <button onclick="loadDate(\''+lastGoodIso+'\')">Son veriye dön</button>'; }
  b.innerHTML=esc(msg)+' <button onclick="loadDate(\''+iso+'\')">Tekrar dene</button>'+extra+' <button aria-label="Kapat" onclick="hideBanner()">✕</button>';
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer=setTimeout(hideBanner, sessiz ? 5000 : 12000);
}
let istenenIso = '';
let loadInFlight = false;
function loadDate(iso, push, yabanciOverride, sessiz){
  if (location.protocol === 'file:') { alert('Tarih değiştirmek için uygulamayı calistir.bat ile (sunucu modunda) açın.'); return; }
  // Aynı gün zaten yükleniyorsa isteği baştan başlatma (uzun süren çekim iptal olmasın).
  if (loadInFlight && iso === istenenIso) return;
  const qs = new URLSearchParams(location.search);
  const hizli = qs.get('hizli') !== '0';
  const yabanci = (typeof yabanciOverride === 'boolean') ? yabanciOverride : (qs.get('yabanci') === '1');
  const bugunIso = isoOf(new Date());
  const gelecek = iso > bugunIso;          // yarın/sonrası: TJK programı henüz yok
  const seq = ++loadSeq;                   // her istek kendi numarasını alır
  istenenIso = iso;
  loadInFlight = true;
  const b = ensureBanner();
  b.className='loadbanner';
  b.innerHTML='Yükleniyor… '+esc(iso)+' <span class="small">(sayfa ve at geçmişi çekiliyor, birkaç saniye sürebilir)</span> <button onclick="loadDate(\''+prevIso(iso)+'\')">‹ Önceki gün</button> <button onclick="loadDate(\''+bugunIso+'\')">Bugüne dön</button>';
  if (currentAbort) { try { currentAbort.abort(); } catch(e){} }
  const ctl = window.AbortController ? new AbortController() : null;
  currentAbort = ctl;
  const opts = ctl ? { signal: ctl.signal } : {};
  const to = setTimeout(function(){ if (ctl) { try { ctl.abort(); } catch(e){} } }, 100000);
  fetch('/api/gun?tarih=' + encodeURIComponent(iso) + '&hizli=' + (hizli?'1':'0') + (yabanci?'&yabanci=1':''), opts)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(p){
      clearTimeout(to);
      if (seq !== loadSeq) return;          // daha yeni bir istek başladı: bunun sonucu yok sayılır
      loadInFlight = false;
      DATA=p; initFromData(); render(); hideBanner();
      try { window.scrollTo(0,0); } catch(e){}
      lastGoodIso = p.TarihISO || iso;
      const geldiIso = p.TarihISO || isoFromTR(p.Tarih || '');
      if (!gelecek && iso && geldiIso && geldiIso !== iso) {
        // İstenen gün yayında/önbellekte yok: kırmızı hata yerine bilgi ver.
        const bb = ensureBanner();
        bb.className='loadbanner';
        bb.innerHTML=esc(isoToTR(iso))+' yayında yok — '+(p.Tarih||'son veri')+' gösteriliyor.';
        setTimeout(function(){ if(seq === loadSeq) hideBanner(); }, 4500);
        return;
      }
      if (gelecek && iso && geldiIso && geldiIso !== iso) {
        // Yarının programı henüz üretilmemişse son günü göster, kırmızı verme.
        const bb = ensureBanner();
        bb.className='loadbanner';
        bb.innerHTML='Yarının programı henüz yayında değil — '+(p.Tarih||'son veri')+' gösteriliyor.';
        setTimeout(function(){ if(seq === loadSeq) hideBanner(); }, 4500);
        return;
      }
      if (push !== false) { try { history.pushState({tarih:iso}, '', '?tarih='+encodeURIComponent(iso)+(hizli?'&hizli=1':'')+(yabanci?'&yabanci=1':'')); } catch(e){} }
    })
    .catch(function(e){
      clearTimeout(to);
      if (seq !== loadSeq) return;          // iptal edilen eski istek: kırmızı uyarı verme
      loadInFlight = false;
      if (gelecek) {
        // Gelecek gün verisi yoksa (404/503) kırmızı hata değil, bilgi göster.
        const bb = ensureBanner();
        bb.className='loadbanner';
        bb.innerHTML='Yarının programı henüz yayında değil.';
        setTimeout(function(){ if(seq === loadSeq) hideBanner(); }, 4500);
        return;
      }
      const msg = (e && e.name === 'AbortError') ? 'zaman aşımı' : ((e && e.message) ? e.message : 'hata');
      const shown = (DATA && DATA.Tarih) ? DATA.Tarih : '';
      // Geçmiş gün yayında yoksa kırmızı hata değil, bilgi bandı göster.
      const bb = ensureBanner();
      bb.className = 'loadbanner';
      bb.innerHTML = esc(isoToTR(iso)) + ' için veri alınamadı (' + esc(msg) + ').' +
        (shown ? ' Şu an ' + esc(shown) + ' gösteriliyor.' : '') +
        ' <button onclick="loadDate(\'' + iso + '\')">Tekrar dene</button>' +

async function istatistikHesapla(kodu){

    ensureBanner().innerHTML=(deneme?'İstatistik hazırlanıyor… ('+esc(tip)+') '+Math.round(deneme*7)+' sn':'İstatistik hesaplanıyor… ('+esc(tip)+')');
    try{
      const sel=race._statSel||{};
      const gr2=(sel.grup!==undefined)?sel.grup:(race.Grup||'');
      const ms2=(sel.mesafe!==undefined)?sel.mesafe:mBand(race.Mesafe);
      const cn2=(sel.cins!==undefined)?sel.cins:raceCins(race);
      const r=await fetch('/api/istatistik?tip='+encodeURIComponent(tip)+'&grup='+encodeURIComponent(gr2)+'&mesafe='+encodeURIComponent(ms2)+'&cins='+encodeURIComponent(cn2)+'&n=50&sehir=-1');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const s=await r.json();
      if(s.Hazirlaniyor){ await new Promise(function(z){ setTimeout(z,7000); }); continue; }
      if(s.Hata) throw new Error(s.Hata);
      race.Istatistik=s; OPEN_STATS[String(kodu)]=true; hideBanner(); render(); return;
    }catch(e){
      const m=((e&&e.message)||'hata');
      // Statik yayında istenen dosya olmayabilir (404/503). Kademeli geri düş:
      // 1) mesafe/cinsiyet süzmesiz (aynı kategori)  2) kategorisiz tür geneli.
      if(/HTTP (404|503)/.test(m)){
        const sel2=race._statSel||{};
        const gr3=(sel2.grup!==undefined)?sel2.grup:(race.Grup||'');
        const adaylar=[
          { g: gr3, not: 'Bu kategori için ayrı istatistik yayında yok; tüm kategoriler gösteriliyor.' },
          { g: '',  not: 'Bu koşu türünün ayrıntılı istatistiği yayında yok; tür geneli gösteriliyor.' }
        ];
        for(let ai=0; ai<adaylar.length; ai++){
          try{
            const a=adaylar[ai];
            const r2=await fetch('/api/istatistik?tip='+encodeURIComponent(tip)+'&grup='+encodeURIComponent(a.g)+'&n=50&sehir=-1');
            if(r2.ok){
              const s2=await r2.json();
              if(s2 && !s2.Hata && !s2.Hazirlaniyor){
                race.Istatistik=s2; OPEN_STATS[String(kodu)]=true; hideBanner(); render();
                ensureBanner().innerHTML='<span class="mut">'+esc(a.not)+'</span>';
                setTimeout(function(){ try{ hideBanner(); }catch(_){} }, 5000);
                return;
              }
            }
          }catch(_){}
        }
        ensureBanner().innerHTML='<span class="mut">Bu koşu türü için geçmiş istatistik henüz yayınlanmadı; TJK verisi alındığında otomatik eklenecek.</span>';
        setTimeout(function(){ try{ hideBanner(); }catch(_){} }, 6000);
        return;
      }
      showError('İstatistik alınamadı ('+m+').', DATA.TarihISO); return;
    }
  }
  showError('İstatistik hazırlanıyor; birkaç dakika sonra tekrar deneyin.', DATA.TarihISO);
}

const JK_CACHE={};

let JK_SIRA='D1';

let JOKEY_ADLARI=[];

// Jokey adi eslestirme: kosuda "M.S.ÇELİK", panelde "MEHMET SALİH ÇELİK" yaziyor.
function jUp(s){ return String(s||'').toUpperCase().replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C'); }
// Uzun hipodrom adlarini il adina indirger: "Bursa Osmangazi Hipodromu" -> "Bursa"
function kisaYer(s){
  const t=String(s==null?'':s).trim();
  if(!t) return t;
  if(/hipodrom/i.test(t)) return t.split(/\s+/)[0];
  if(/^(Bursa|İstanbul|Izmir|İzmir|Ankara|Adana|Antalya|Kocaeli|Elazığ|Diyarbakır|Şanlıurfa|Konya|Trabzon|Bursa)\s+(Osmangazi|Veliefendi|Şirinyer|Yeşiloba|Kartepe|75\.)/i.test(t)) return t.split(/\s+/)[0];
  return t;
}
function jPar(s){ return jUp(s).replace(/\(.*?\)/g,'').replace(/\./g,' ').split(/\s+/).filter(Boolean); }
function jKey(s){
  const p=jPar(s); if(!p.length) return '';
  if(p.length===1) return p[0];
  return p.slice(0,-1).map(x=>x.charAt(0)).join('')+p[p.length-1];
}
function jEsles(full, short){
  const a=jPar(full), b=jPar(short);
  if(!a.length||!b.length) return false;
  if(a[a.length-1]!==b[b.length-1]) return false;      // soyad ayni olmali
  const ag=a.slice(0,-1), bg=b.slice(0,-1);
  if(bg.length>ag.length) return false;
  for(let i=0;i<bg.length;i++){ if(!ag[i]||ag[i].indexOf(bg[i])!==0) return false; }
  return true;
}
// Kisa adi (kosu listesindeki) paneldeki tam ada cevirir
function tamAd(short){
  const s=String(short||''), k=jKey(s);
  const t=JOKEY_ADLARI.filter(f=>jKey(f)===k);
  if(t.length===1) return t[0];
  const p=JOKEY_ADLARI.filter(f=>jEsles(f,s));
  return p.length===1 ? p[0] : s;
}
function kosudaVar(race, name){
  const n=String(name||'');
  return (race.Atlar||[]).some(h=>h.Jokey && (String(h.Jokey)===n || tamAd(h.Jokey)===n));
}
// At satirinda jokey adi vurgulanacak mi (secili jokey veya arama kutusu)
function jokeyVurgu(h){
  if(!h || !h.Jokey) return false;
  const ad=String(h.Jokey), tam=String(tamAd(ad));
  if(SEC_JOKEY && (ad===SEC_JOKEY || tam===SEC_JOKEY)) return true;
  const nq=jUp(JF_ARA).replace(/[^A-Z0-9]/g,'');
  if(nq){
    const s=jUp(ad).replace(/[^A-Z0-9]/g,'')+' '+jUp(tam).replace(/[^A-Z0-9]/g,'');
    return s.indexOf(nq)>=0;
  }
  return false;
}

// Yalnizca secili jokeyin ati mi (satir renklendirmesi icin; arama vurgusu haric)
function jokeySecili(h){
  if(!SEC_JOKEY || !h || !h.Jokey) return false;
  const ad=String(h.Jokey);
  return ad===SEC_JOKEY || String(tamAd(ad))===SEC_JOKEY;
}

function surfaceBadge(race, atId){
  // Bu koşunun pisti her zaman programdan gelir; hızlı veride Yuzey boş olabilir.
  const p = race.Pist || '';
  if (p) {
    const cls = p === 'Çim' ? 'cim' : (p === 'Kum' ? 'kum' : (p === 'Sentetik' ? 'snt' : ''));
    return `<span class="chip pist ${cls}" title="Bu koşunun pisti">${esc(p)}</span>`;
  }
  const v = race.Yuzey && race.Yuzey[atId];
  const k = v ? v.Karar : 'YOK';

function jockeyWinsOf(race, jid){
  const a = (race.JokeySira||[]).find(x=>String(x.JokeyId)===String(jid));
  return a ? a.Birincilik : null;
}
function jockeyInfoOf(race, jid){

}
// Analizde JokeySira bos geldiyse (hizli gun verisi) hipodromun TJK jokey tablosundan doldur.
async function jokeySiraDoldur(race){
  if(!race || (race.JokeySira||[]).length) return;
  if(String(race.KosuKodu||'').charAt(0)==='-') return;   // yurt disi: TJK istatistigi yok
  if(!race.SehirId) return;
  try{
    const r=await fetch('/api/jokeyler?sehir='+encodeURIComponent(race.SehirId)+'&yil='+encodeURIComponent(DONEM)+'&_='+Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const d=await r.json(); const tab=d.Jokeyler||[]; if(!tab.length) return;
    const seen={}; const arr=[];
    (race.Atlar||[]).forEach(h=>{
      const jid=String(h.JokeyId||'');
      if(!jid || jid==='0' || seen[jid]) return; seen[jid]=1;
      const t=tab.find(x=>String(x.JokeyId)===jid) || tab.find(x=>jEsles(x.Jokey, h.Jokey));
      arr.push({ Jokey:h.Jokey, JokeyTam:h.JokeyTam, JokeyId:h.JokeyId, At:h.At,
        Birincilik:t?t.D1:null, Kosu:t?t.Kosu:null, Galibiyet:t?t.P1:null, Ilk5:t?t.Ilk5:null });
    });
    arr.sort((a,b)=>{ const A=(a.Birincilik==null?-1:a.Birincilik), B=(b.Birincilik==null?-1:b.Birincilik); return B-A; });
    race.JokeySira=arr;
  }catch(e){}
}

function mesafeBadge(race, atId){
  const x = race.MesafeKayit && race.MesafeKayit[atId];
  if(!x || !x.Mesafe) return '—';
  /* Bu mesafedeki en son koşu: derece + bu şehirde mi (yeşil/kırmızı) + pist kısaltması */
  if(x.SonDerece){
    let t = String(x.SonDerece||'').trim();
    const mm = t.match(/\d+[.:]\d{2}[.:]\d{2}/); if(mm) t = mm[0];
    const pist = x.SonPist==='Kum'?'kum':(x.SonPist==='Sentetik'?'snt':(x.SonPist==='Çim'?'çm':''));
    const same = !!x.AyniSehir;
    /* Koşunun yapıldığı il: ilk üç harf (ANK, BUR, İST...); bu ilse yeşil, değilse sarı. */
    const ilk = String(x.SonSehir||'').trim().split(/\s+/)[0];
    let kod = '';
    try { kod = ilk ? ilk.slice(0,3).toLocaleUpperCase('tr') : ''; } catch(e){ kod = ilk ? ilk.slice(0,3).toUpperCase() : ''; }
    const yer = kod
      ? `<span class="mcity ${same?'ok':'bad'}" title="${same?'Bu ilde':'Başka ilde'}${x.SonSehir?': '+esc(x.SonSehir):''}">${esc(kod)}</span>`
      : `<span class="mdot ${same?'ok':'bad'}" title="${same?'Bu ilde':'Başka ilde'}"></span>`;
    const title = 'Bu mesafedeki son koşu'+(x.SonTarih?' ('+x.SonTarih+')':'')+': '+t+(x.SonSira!=null?' · '+x.SonSira+'.':'')+
      (x.SonSehir?' · '+x.SonSehir:'')+(same?' (bu il)':' (başka il)')+
      ' · '+x.Kosu+' koşu / '+x.Birinci+' birinci';
    return `<span class="mtime" title="${esc(title)}">${esc(t)}</span> ${yer}${pist?' <span class="mtrk">'+pist+'</span>':''}`;
  }
  if(x.Kosu>0) return `<span class="${x.Birinci>0?'ok':'mut'}"><b>${x.Kosu}</b>/${x.Birinci}</span>`;
  if(x.YakinKosu>0) return `<span class="small">≈${x.YakinMesafe} · ${x.YakinKosu}/${x.YakinBirinci}</span>`;
  if(x.IlkKez) return `<span class="badge b-yok">ilk</span>`;
  return '—';
}
function panelMesafe(race){

    const parts=[];
    Object.keys(sn).sort((a,b)=>b-a).forEach(k=>{
      const iyi=en[k]&&en[k]!==sn[k]?` <span class="small">(en iyi ${esc(en[k])})</span>`:'';
      parts.push(`${k}m ${esc(sn[k])}${iyi}`);
    });
    const yas = (w.Gun!=null) ? (w.Gun+' gün önce' + (w.Gun>30 ? ' — uzun ara' : (w.Gun<=14 ? ' · yakın' : ''))) : '';
    const ust = [w.SonTarih, yas, w.Hip, w.Pist, w.Tur, w.Jokey].filter(Boolean).map(esc).join(' · ');
    rows+=`<div class="rank"><span>${esc(h.At)}<div class="small">${ust}</div><div class="small">${parts.join(' · ')||'derece yok'}</div></span><span class="small">${w.Adet} idman</span></div>`;
  });
  if(!rows) return '';
  return `<div class="panel"><h4>Son idmanlar (antrenman)</h4>${rows}
    <div class="note">TJK idman kayıtları: son galop/sprint tarihi, hipodrom, pist, idman jokeyi ve mesafe dereceleri. Derece küçükse daha hızlıdır; parantezdekiler atın o mesafedeki en iyi idman derecesidir. Form göstergesidir, tek başına yeterli değildir.</div></div>`;
}
function statsPanel(race){

  let bars=''; const bands=s.HpBantlari||[];

  const mx=Math.max(1,...bands.map(b=>Math.max(b.Oran||0,giren[b.Bant]||0)));
  bands.forEach(b=>{ const w=Math.round(100*(b.Oran||0)/mx); const gv=(giren[b.Bant]!=null?giren[b.Bant]:null);
    bars+=`<div class="bar"><span>${esc(b.Bant)}</span><span class="track"><span class="fill" style="width:${w}%"></span></span><span class="num">%${b.Oran} <span class="mut">/ giren ${gv==null?'—':'%'+gv}</span></span></div>`; });
  const sk=s.Siklet, skg=s.SikletGiren;
  const hasF=(s.KadroSayisi||0)>0;
  return `<div class="stats">
    ${statKontroller(race)}
    <div class="small" style="margin-bottom:8px">${esc(s.Tip)} · ${esc(s.Grup)} · ${s.MesafeBand?esc(s.MesafeBand)+' m · ':''}son ${s.Yil} yıl · ${s.KosuSayisi} koşu</div>

      <div>Giren at sayısı <b>${s.HpBantlariGiren?s.HpBantlariGiren.reduce((a,b)=>a+(b.Giren||0),0):'—'}</b></div>
    </div>
    ${!hasF?'<div class="small mut" style="margin:-2px 0 6px">Mesafe/cinsiyet süzmesinde kadro verisi alınmaz; favori ve giren oranları bu yüzden boş.</div>':''}
    <div class="small" style="margin:10px 0 6px">Kazananların handikap puanı dağılımı — kazanan % / giren % (yüksekten düşüğe)</div>

    <div class="note">Giren % = o banttaki tüm atların payı. Kazanan % giren %'den belirgin yüksekse bant avantajlı görünür; örneklem ${s.KosuSayisi||0} koşu, tek başına yeterli değildir.</div>
  </div>`;
}

const TUR_CACHE={}, TUR_STATE={};
let TUR_SEQ=0;
function turOzet(s, sehir, sadi, n){
  const yer = (sehir && sehir!=='-1') ? (sadi||'Hipodrom') : 'Tüm Türkiye';
  const ks=(s.Kosular||[]);
  const rows=ks.slice(0,10).map(r=>`<tr><td>${esc(r.Tarih)}</td><td>${esc(kisaYer(r.Sehir))}</td><td>${esc(r.Pist)}</td><td>${r.Mesafe?r.Mesafe+' m':'—'}</td><td>${esc(r.Irk)}</td><td>${esc(r.At)}</td><td>${r.Kilo!=null?r.Kilo:'—'}</td><td>${r.HP!=null?r.HP:'—'}</td><td>${r.HpSira!=null?r.HpSira:'—'}</td><td>${r.Agf!=null?'%'+r.Agf:'—'}</td><td>${r.Favori?'✔':''}</td></tr>`).join('');

    <div>En düşük HP <b>${pv(s.EnDusukHpKazanma)}</b></div>
    <div>Ort. kilo <b>${s.Siklet?(s.Siklet.Ortalama+' kg'):'—'}</b> <span class="small">giren ${s.SikletGiren?s.SikletGiren.Ortalama+' kg':'—'}</span></div>
    <div>Ort. yaş <b>${s.OrtYas!=null?s.OrtYas:'—'}</b></div>

  <div style="overflow:auto"><table><thead><tr><th>Tarih</th><th>Şehir</th><th>Pist</th><th>Mesafe</th><th>Irk</th><th>Kazanan</th><th>Kilo</th><th>HP</th><th>HP sıra</th><th>AGF</th><th>Fav</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="small" style="margin-top:6px">Son 10 koşu · <a href="turler.html" target="_blank" rel="noopener">tam sayfa ↗</a></div>`;

window.turKapat=function(id){ const b=document.getElementById(id+'t'); if(b) b.style.display='none'; };
async function turIstatistik(id, tip, sehirId, sadi, opt, grup){
  const box=document.getElementById(id+'t'); if(!box) return;
  const st = TUR_STATE[id] || (TUR_STATE[id]={sehir:(sehirId?String(sehirId):'-1'), n:50});
  if(opt){ if(opt.sehir!=null) st.sehir=String(opt.sehir); if(opt.n) st.n=Number(opt.n); }
  if(!opt && box.style.display!=='none'){ box.style.display='none'; return; }
  box.style.display='block';
  try{ box.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){ box.scrollIntoView(); }
  const tq=(tip||'').replace(/'/g,'').replace(/"/g,'');
  const sq=(sadi||'').replace(/'/g,'').replace(/"/g,'');
  const gq=(grup||'').replace(/'/g,'').replace(/"/g,'');
  const call=(o)=>`turIstatistik('${id}','${tq}','${sehirId||''}','${sq}',${o},'${gq}')`;
  let bar='<div class="small" style="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">';
  bar+=`<a class="sizebtn${st.sehir==='-1'?' sel':''}" href="#" onclick="${call("{sehir:'-1'}")};return false">Tüm Türkiye</a>`;
  if(sadi){ bar+=`<a class="sizebtn${st.sehir!=='-1'?' sel':''}" href="#" onclick="${call("{sehir:'"+String(sehirId||'')+"'}")};return false">${esc(sadi)}</a>`; }
  bar+='<span style="width:8px"></span>';
  [50,100,200].forEach(k=>{ bar+=`<a class="sizebtn${st.n===k?' sel':''}" href="#" onclick="${call('{n:'+k+'}')};return false">son ${k}</a>`; });
  bar+='<a class="sizebtn" href="#" onclick="turKapat(\''+id+'\');return false" style="margin-left:auto">kapat ✕</a>';
  bar+='</div>';
  box.innerHTML = bar + '<div id="'+id+'tb" class="small mut">İstatistik yükleniyor… ('+esc(tip||'')+')</div>';
  const body=document.getElementById(id+'tb');
  const key=(tip||'')+'|'+(grup||'')+'|'+st.sehir+'|'+st.n;
  if(TUR_CACHE[key]){ body.innerHTML=TUR_CACHE[key]; return; }
  const turSeq=++TUR_SEQ;
  try{
    const r=await fetch('/api/istatistik?tip='+encodeURIComponent(tip||'')+'&grup='+encodeURIComponent(grup||'')+'&n='+st.n+'&sehir='+encodeURIComponent(st.sehir));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const s=await r.json();
    if(turSeq!==TUR_SEQ) return;
    if(s.Hazirlaniyor){ body.innerHTML='<div class="hazirbox"><b>İstatistik hazırlanıyor…</b> TJK geçmişi taranıyor; birkaç dakika içinde kendiliğinden dolacak.</div>'; setTimeout(function(){ turIstatistik(id,tip,sehirId,sadi,{sehir:st.sehir,n:st.n},grup); }, 8000); return; }
    if(s.Hata) throw new Error(s.Hata);
    TUR_CACHE[key]=turOzet(s, st.sehir, sadi, st.n); body.innerHTML=TUR_CACHE[key];
  }catch(e){
    body.innerHTML='<div class="small mut">İstatistik alınamadı ('+esc((e&&e.message)||'hata')+'). <a href="#" onclick="'+call('{}')+';return false">tekrar dene</a></div>';
  }
}
function raceCard(race, idx){
  const id='r'+idx;
  const pistCls=race.Pist==='Çim'?'cim':(race.Pist==='Kum'?'kum':'');
  const sonucVar = h => h.Sonuc!=null && /^\d+$/.test(String(h.Sonuc).trim());
  const done = isPast(currentDay().Tarih) || (race.Atlar||[]).some(sonucVar);
  const ilk4 = (race.Atlar||[])
      .filter(sonucVar)
      .sort((a,b)=>parseInt(a.Sonuc,10)-parseInt(b.Sonuc,10))
      .slice(0,4);
  const gnyK = h => {
    if(h.Gny==null || String(h.Gny).trim()==='') return '';
    const n=Number(h.Gny);
    return ' <span class="mut" style="font-weight:400">('+(Number.isFinite(n)?n.toFixed(2).replace('.',','):esc(h.Gny))+')</span>';
  };
  const hasAnalysis = race.__detay || (race.JokeySira && race.JokeySira.length) || (race.IkiliGecme && race.IkiliGecme.Liste && race.IkiliGecme.Liste.length) || (race.Yuzey && Object.keys(race.Yuzey).length) || (race.Idman && Object.keys(race.Idman).length) || !!race.Secim;
  const raceCls = 'race';
  const jkAra = (race.Atlar||[]).map(h=>{
    if(!h.Jokey) return '';
    const tam=String(tamAd(h.Jokey));
    return jUp(h.Jokey).replace(/[^A-Z0-9]/g,'')+' '+jUp(tam).replace(/[^A-Z0-9]/g,'')+' '+jUp(tam);
  }).join(' ');
  return `<section class="${raceCls}" data-jk="${esc(jkAra)}" id="${id}">
    <div class="race-h" onclick="toggleRace('${id}')">
      <span class="race-no">${esc(race.KosuNo)}. Koşu ${esc(race.Saat)}</span>
      <span class="chip">${esc(kisaYer(race.Sehir||''))}</span>
      <a class="chip link" href="turler.html" onclick="event.stopPropagation(); if(window.turIstatistik){ try{ event.preventDefault(); turIstatistik('${id}','${esc(race.Tip||'')}','${race.SehirId||''}','${esc(race.Sehir||'')}',null,'${esc(race.Grup||'')}'); }catch(e){ window.location.href=this.getAttribute('href'); } }" title="Tıklayınca bu koşu türünün son 50 koşusu burada açılır">${esc(race.Tip)||'—'} ▾</a>
      <span class="chip">${esc(race.Grup)||''}</span>
      ${race.Cinsiyet?`<span class="chip">${esc(race.Cinsiyet)}</span>`:''}
      <span class="chip">${race.Mesafe?race.Mesafe+' m':''}</span>
      ${race.Pist?`<span class="chip pist ${pistCls}">${esc(race.Pist)}</span>`:''}
      ${race.Yorum&&race.Yorum.Seviye&&race.Yorum.Seviye!=='yok'?`<span class="chip">Sürpriz: ${race.Yorum.Seviye==='yuksek'?'Yüksek':(race.Yorum.Seviye==='dusuk'?'Düşük':'Orta')}</span>`:''}
      ${done?'<span class="chip done">bitti</span>':''}
      <span class="spacer"></span><span class="toggle">aç/kapat ▾</span>
    </div>
    ${ilk4.length?`<div class="sonucbar" onclick="toggleRace('${id}')" title="Günün biten koşusu — parantez içi ganyan">
      <span class="sb-ad">Sonuç</span>
      ${ilk4.map((h,i)=>`<span class="sb-at"><b>${i+1}.</b> ${esc(h.At)}${gnyK(h)}</span>`).join('')}
    </div>`:''}
    <div class="race-b" id="${id}b"${(window.innerWidth<=700 && idx>0) ? ' style="display:none"' : ''}>
      <div id="${id}t" class="turstat" style="display:none"></div>
      ${panelProgram(race)}
      ${panelVerdict(race)}
      ${horseTable(race)}
      ${hasAnalysis
        ? `<div class="panels">
        ${panelSelection(race)}
        ${panelJockey(race)}
        ${panelH2H(race)}
        ${panelOrigin(race)}
        ${panelMesafe(race)}
        ${panelConsensus(race)}
        ${panelForm(race)}
        ${panelCombo(race)}
        ${panelWorkouts(race)}
      </div>`
        : ''}
      <button class="btn-stats" onclick="event.stopPropagation(); analizYukle('${esc(race.KosuKodu)}')">${hasAnalysis?'Ayrıntılı analizi yenile':'Ayrıntılı analizi yükle (jokey · kum/çim · ikili geçme · istatistik)'}</button>
      <button class="btn-stats" onclick="event.stopPropagation(); var k='${esc(race.KosuKodu)}'; var e=document.getElementById('${id}s'); var sh=(e.style.display==='none'); e.style.display=sh?'block':'none'; OPEN_STATS[k]=sh;">İstatistik ▾</button>
      <div id="${id}s" style="display:${OPEN_STATS[String(race.KosuKodu)]?'block':'none'}">${statsPanel(race)}</div>
    </div>
  </section>`;
}

  e.style.display = e.style.display==='none' ? 'block' : 'none';

let JF_ARA='';
function jfUygula(){
  const n=jUp(JF_ARA).replace(/[^A-Z0-9]/g,'');
  let gor=0, tot=0;
  document.querySelectorAll('section.race').forEach(function(s){
    tot++;
    const ok = !n || (s.getAttribute('data-jk')||'').indexOf(n)>=0;
    s.style.display = ok ? '' : 'none';
    if(ok) gor++;
  });
  const say=document.getElementById('jfSayi');
  if(say) say.textContent = n ? (gor+' koşu'+(gor?'':' — eşleşme yok, adı farklı yazılmış olabilir')) : (tot+' koşu');
}
function baglaJf(){
  const inp=document.getElementById('jfAra');
  if(!inp) return;
  inp.oninput=function(){ JF_ARA=inp.value; jfUygula(); };
  jfUygula();
}

} else {

  try {
    const qs2 = new URLSearchParams(location.search);
    const urlTarih = qs2.get('tarih') || '';
    const mevcut = DATA.TarihISO || isoFromTR(DATA.Tarih || '');
    const bugun = isoOf(new Date());

      setTimeout(function(){ loadDate(urlTarih, false, undefined, true); }, 250);
    } else if (mevcut && mevcut !== bugun && location.protocol !== 'file:' && (!urlTarih || (pwa && urlTarih < bugun))) {
      setTimeout(function(){ loadDate(bugun, false, undefined, true); }, 250);
    }
  } catch(e){}
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') { navigator.serviceWorker.register('sw.js').catch(function(){}); }
/* Gece yarısı devri: uygulama açık kalırsa ertesi gün otomatik bugüne dön. */
document.addEventListener('visibilitychange', function(){
  if (document.hidden || location.protocol === 'file:') return;

});

<script>
/* Logo alani: tikla -> resim sec (localStorage), sag tik -> kaldir.
   Kendi kopyanda degistirilebilir; odunc kopyada AT_LOGO gomulu + AT_LOGO_KILIT. */
(function(){
  var kutu=document.getElementById('logoKutu'), img=document.getElementById('logoImg');
  var yazi=document.getElementById('logoYazi'), dosya=document.getElementById('logoDosya');
  if(!kutu||!img||!dosya) return;
  var varsayilan=img.getAttribute('src')||'';
  var gomulu=window.AT_LOGO||'', kilit=!!window.AT_LOGO_KILIT;
  var yedekAdim=0;
  img.addEventListener('error', function(){
    // Küçük WebP → büyük WebP → PNG → yer tutucu
    var s=img.getAttribute('src')||'';
    if(yedekAdim===0 && /logo-kucuk\.webp/i.test(s)){ yedekAdim=1; img.src='logo.webp'; return; }
    if(yedekAdim<2 && /\.webp(\?|$)/i.test(s)){ yedekAdim=2; img.src='logo.png'; return; }
    img.hidden=true; yazi.hidden=false; kutu.style.borderStyle='dashed';
  });
  function uygula(src){
    if(src){ img.src=src; img.hidden=false; yazi.hidden=true; kutu.style.borderStyle='solid'; }
    else { img.removeAttribute('src'); img.hidden=true; yazi.hidden=false; kutu.style.borderStyle='dashed'; }
  }
  var kayitli=null;
  try{ kayitli=localStorage.getItem('at-logo'); }catch(e){}
  // Siralama: kilitli kopyada gomulu logo; normalde tarayicida secilen; yoksa varsayilan logo.png
  uygula(kilit ? (gomulu||varsayilan) : (kayitli||gomulu||varsayilan));
  if(kilit){ kutu.style.cursor='default'; kutu.removeAttribute('title'); return; }
  kutu.addEventListener('click', function(){ dosya.click(); });
  dosya.addEventListener('change', function(){
    var f=dosya.files&&dosya.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{ localStorage.setItem('at-logo', r.result); }catch(e){}
      uygula(r.result); dosya.value='';
    };
    r.readAsDataURL(f);
  });
  kutu.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if(confirm('Logoyu kaldırsın mı?')){
